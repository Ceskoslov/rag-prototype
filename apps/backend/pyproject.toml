[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-rag-backend"
version = "1.0.0"
description = "Domain-agnostic hybrid RAG backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.1",
    "langchain-huggingface==1.2.2",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.10",
    "chromadb==1.5.9",
    # ARQ 0.28 currently requires redis-py <6; Redis server 8.1 is supported.
    "redis==5.3.1",
    "arq==0.28.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.5",
    "sentence-transformers==5.6.1",
    "rank-bm25==0.2.2",
    "langgraph-checkpoint-postgres==3.1.1",
    "ragas==0.4.3",
    "pypdf==6.14.2",
    "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "fakeredis==2.34.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff.lint]
# FastAPI dependency injection intentionally calls Depends in signatures.
# Boundary adapters log broad third-party failures and return safe fallbacks.
ignore = ["B008", "BLE001", "S112"]
