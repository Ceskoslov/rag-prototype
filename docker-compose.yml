x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://${DB_USER:-rag_user}:${DB_PASSWORD:-rag_password}@postgres:5432/${DB_NAME:-rag_db}
  REDIS_URL: redis://redis:6379/0
  ARQ_REDIS_URL: redis://redis:6379/1
  CHROMA_API_URL: http://chromadb:8000
  DATA_DIR: /data
  API_KEY: ${API_KEY:-test-api-key-12345}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  ENABLE_EVALUATION: ${ENABLE_EVALUATION:-false}

x-backend: &backend
  build:
    context: ./apps/backend
  environment: *backend-env
  volumes:
    - ./data:/data
    - model_cache:/home/appuser/.cache

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag_password}
      POSTGRES_DB: ${DB_NAME:-rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${DB_USER:-rag_user} -d ${DB_NAME:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.1-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  chromadb:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/data
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8001}:8000"

  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/api/v1/health]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *backend
    command: arq app.workers.worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, arq, app.workers.worker.WorkerSettings, --check]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  seed:
    <<: *backend
    command: python scripts/seed.py
    depends_on:
      worker:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./apps/frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://api:8000
      API_KEY: ${API_KEY:-test-api-key-12345}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:5173]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:80:80"
    environment:
      API_KEY: ${API_KEY:-test-api-key-12345}
      NGINX_ENVSUBST_FILTER: API_KEY
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  model_cache:
