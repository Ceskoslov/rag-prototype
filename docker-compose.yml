version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag_password}
      POSTGRES_DB: ${DB_NAME:-rag_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - rag_network
    restart: unless-stopped

  # Redis Cache & ARQ Queue
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - rag_network
    restart: unless-stopped

  # ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag_chromadb
    environment:
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - rag_network
    restart: unless-stopped

  # FastAPI Backend
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: rag_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${DB_USER:-rag_user}:${DB_PASSWORD:-rag_password}@postgres:5432/${DB_NAME:-rag_db}
      REDIS_URL: redis://redis:6379/0
      CHROMA_API_URL: http://chromadb:8000
      PYTHONUNBUFFERED: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - rag_network
    restart: unless-stopped

  # ARQ Worker for Background Jobs
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: rag_worker
    command: arq app.workers.worker.WorkerSettings
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${DB_USER:-rag_user}:${DB_PASSWORD:-rag_password}@postgres:5432/${DB_NAME:-rag_db}
      REDIS_URL: redis://redis:6379/0
      CHROMA_API_URL: http://chromadb:8000
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-n", "1", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - rag_network
    restart: unless-stopped

  # Data Seeding Service (runs once at startup)
  seed:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: rag_seed
    command: python -m app.seeds.main
    environment:
      DATABASE_URL: postgresql://${DB_USER:-rag_user}:${DB_PASSWORD:-rag_password}@postgres:5432/${DB_NAME:-rag_db}
      CHROMA_API_URL: http://chromadb:8000
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - rag_network
    restart: "no"

  # Vite Frontend Dev Server
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: dev
    container_name: rag_frontend
    command: npm run dev
    environment:
      VITE_API_URL: http://localhost/api
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - rag_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: rag_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      - rag_network
    restart: unless-stopped

networks:
  rag_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
