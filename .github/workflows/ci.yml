name: RAG demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.0'
          python-version: '3.13'
      - run: uv sync --frozen --extra dev
        working-directory: apps/backend
      - run: uv run --no-sync ruff check app tests scripts
        working-directory: apps/backend
      - run: uv run --no-sync pytest
        working-directory: apps/backend
      - run: uv run --no-sync python scripts/benchmark.py --output /tmp/retrieval-report.json
        working-directory: apps/backend
      - run: uv run --no-sync alembic upgrade head
        working-directory: apps/backend
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/migration-check.sqlite
      - uses: actions/upload-artifact@v7
        with:
          name: retrieval-report
          path: /tmp/retrieval-report.json
  evaluator-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.0'
          python-version: '3.13'
      - run: uv sync --frozen --extra dev --extra evaluation
        working-directory: apps/backend
      - run: uv run --no-sync pytest tests/services/test_evaluator_contract.py
        working-directory: apps/backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-report
          path: apps/frontend/playwright-report
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          printf 'LOCAL_UID=%s\nLOCAL_GID=%s\n' "$(id -u)" "$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose config -q
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: bash scripts/smoke.sh
      - run: |
          docker compose logs --no-color
          task_frontend_id=$(docker compose ps -q frontend)
          if [ -n "$task_frontend_id" ]; then
            docker inspect --format '{{json .State.Health}}' "$task_frontend_id"
          fi
        if: failure()
      - run: docker compose down
        if: always()
