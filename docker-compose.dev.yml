version: '3.9'

services:
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    volumes:
      - ./apps/backend:/app
      - /app/.venv
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      PYTHONDONTWRITEBYTECODE: "1"

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    volumes:
      - ./apps/backend:/app
      - /app/.venv
      - /app/__pycache__
    command: arq app.tasks.WorkerSettings --watch
    environment:
      ENVIRONMENT: development
      PYTHONDONTWRITEBYTECODE: "1"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost/api
      NODE_ENV: development

  postgres:
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  chromadb:
    ports:
      - "8001:8000"

  nginx:
    ports:
      - "80:80"
